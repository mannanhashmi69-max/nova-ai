<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nova AI</title>
<style>
  :root{
    --bg-0:#0B0F19; --bg-1:#111827; --card:#1F2937; --border:#374151;
    --primary:#3B82F6; --primary-d:#2563EB; --success:#10B981; --warning:#F59E0B; --error:#EF4444;
    --text-0:#FFFFFF; --text-1:#D1D5DB; --text-2:#9CA3AF;
    --radius:10px; --sidebar-w:300px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg-0); color:var(--text-1); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--primary);}
  button{font-family:inherit;}
  *:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ───── Icon system (stroke-based, currentColor — matches button/text color automatically) ───── */
  .icon{
    fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    display:inline-block; vertical-align:middle; flex-shrink:0;
  }
  .icon-solid{fill:currentColor; stroke:none;}
  .icon-spin{animation:icon-spin .9s linear infinite; transform-origin:center;}
  @keyframes icon-spin{to{transform:rotate(360deg);}}
  .btn .icon, .nav-btn .icon, .hamburger .icon, .send-btn .icon, .icon-btn .icon{flex-shrink:0;}

  .app{display:flex; height:100vh; width:100%;}

  /* ───── Sidebar ───── */
  .sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--bg-1); border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100%; transition:transform .25s ease; z-index:50;
  }
  .sidebar-header{padding:20px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border);}
  .logo-mark{
    width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--primary),#8B5CF6);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; flex-shrink:0;
  }
  .logo-mark .icon{width:18px; height:18px;}
  .empty-state .logo-mark .icon{width:26px; height:26px;}
  .logo-text{font-weight:700; font-size:17px; color:var(--text-0); letter-spacing:.2px;}
  .status-badge{
    margin-left:auto; font-size:11px; padding:3px 8px; border-radius:20px; background:rgba(16,185,129,.15);
    color:var(--success); border:1px solid rgba(16,185,129,.3); display:flex; align-items:center; gap:5px;
  }
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--success); flex-shrink:0;}
  .status-dot.down{background:var(--error);}
  .status-badge.down{background:rgba(239,68,68,.15); color:var(--error); border-color:rgba(239,68,68,.3);}

  .user-section{padding:16px 20px; border-bottom:1px solid var(--border);}
  .user-card{display:flex; align-items:center; gap:10px;}
  .user-avatar{
    width:38px; height:38px; border-radius:50%; background:var(--card); display:flex; align-items:center;
    justify-content:center; font-weight:600; color:var(--text-0); flex-shrink:0; overflow:hidden; border:1px solid var(--border);
  }
  .user-avatar img{width:100%; height:100%; object-fit:cover;}
  .user-meta{overflow:hidden; flex:1;}
  .user-name{font-size:13px; color:var(--text-0); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .user-email{font-size:11px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .auth-buttons{display:flex; flex-direction:column; gap:8px;}
  .btn{
    border:1px solid var(--border); background:var(--card); color:var(--text-0); padding:9px 12px; border-radius:var(--radius);
    font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:background .15s,border-color .15s; font-weight:500;
  }
  .btn:hover{background:#283242; border-color:#4B5563;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.55; cursor:not-allowed;}
  .btn-primary{background:var(--primary); border-color:var(--primary);}
  .btn-primary:hover{background:var(--primary-d);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .btn-ghost{background:transparent;}
  .btn-ghost:hover{background:var(--card);}
  .btn-danger-outline{border-color:rgba(239,68,68,.4); color:var(--error);}
  .btn-danger-outline:hover{background:rgba(239,68,68,.1);}

  .model-section{padding:16px 20px; border-bottom:1px solid var(--border);}
  .section-label{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-2); margin-bottom:8px; font-weight:600;}
  select{
    width:100%; background:var(--card); color:var(--text-0); border:1px solid var(--border); border-radius:var(--radius);
    padding:9px 10px; font-size:13px; cursor:pointer;
  }
  select:disabled{opacity:.5;}
  .model-desc{font-size:11px; color:var(--text-2); margin-top:6px; line-height:1.4;}

  .nav{flex:1; padding:12px 14px; display:flex; flex-direction:column; gap:4px; overflow-y:auto;}
  .nav-btn{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius); background:transparent;
    border:none; color:var(--text-1); font-size:14px; cursor:pointer; text-align:left; width:100%; transition:background .15s,color .15s;
  }
  .nav-btn:hover{background:var(--card); color:var(--text-0);}
  .nav-btn.active{background:rgba(59,130,246,.15); color:var(--primary); font-weight:600;}
  .nav-icon{width:18px; text-align:center; flex-shrink:0;}

  .sidebar-footer{padding:14px 20px; border-top:1px solid var(--border); font-size:11px; color:var(--text-2); text-align:center;}

  /* ───── Main ───── */
  .main{flex:1; display:flex; flex-direction:column; height:100%; min-width:0; position:relative;}
  .topbar{
    display:none; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border); background:var(--bg-1);
  }
  .hamburger{
    background:transparent; border:1px solid var(--border); color:var(--text-0); border-radius:8px; width:36px; height:36px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; flex-shrink:0;
  }
  .overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40;}
  .overlay.show{display:block;}

  .page{flex:1; display:none; flex-direction:column; overflow:hidden; min-height:0;}
  .page.active{display:flex;}

  /* ── Chat header ── */
  .page-header{
    padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;
    background:var(--bg-1); gap:12px; flex-wrap:wrap;
  }
  .page-title{font-size:16px; font-weight:700; color:var(--text-0);}
  .header-meta{display:flex; align-items:center; gap:8px; font-size:12px; flex-wrap:wrap;}
  .pill{
    padding:4px 10px; border-radius:20px; background:var(--card); border:1px solid var(--border); color:var(--text-1); font-size:11.5px;
    display:inline-flex; align-items:center; gap:5px;
  }
  .pill-primary{background:rgba(59,130,246,.15); border-color:rgba(59,130,246,.3); color:#93C5FD;}

  /* ── Conversation ── */
  .conversation{flex:1; overflow-y:auto; padding:24px; scroll-behavior:smooth;}
  .empty-state{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-2); gap:10px; text-align:center;
  }
  .empty-state .logo-mark{width:54px; height:54px; font-size:22px; margin-bottom:6px;}
  .msg-row{display:flex; margin-bottom:18px; gap:10px;}
  .msg-row.user{justify-content:flex-end;}
  .msg-row.assistant{justify-content:flex-start;}
  .bubble-wrap{max-width:75%; display:flex; flex-direction:column;}
  .msg-row.user .bubble-wrap{align-items:flex-end;}
  .bubble{
    padding:12px 16px; border-radius:14px; font-size:14.5px; line-height:1.55; word-wrap:break-word; white-space:pre-wrap;
  }
  .msg-row.user .bubble{background:var(--primary); color:#fff; border-radius:14px 14px 4px 14px;}
  .msg-row.assistant .bubble{background:var(--card); border:1px solid var(--border); color:var(--text-1); border-radius:14px 14px 14px 4px;}
  .bubble code{background:rgba(0,0,0,.3); padding:2px 5px; border-radius:4px; font-family:"SF Mono",Consolas,Menlo,monospace; font-size:13px;}
  .bubble pre{background:#0B0F19; border:1px solid var(--border); padding:10px 12px; border-radius:8px; overflow-x:auto; margin:8px 0;}
  .bubble pre code{background:none; padding:0;}
  .bubble h1,.bubble h2,.bubble h3{margin:8px 0 4px; color:var(--text-0);}
  .bubble ul,.bubble ol{margin:6px 0; padding-left:20px;}
  .msg-meta{display:flex; align-items:center; gap:8px; margin-top:5px; font-size:11px; color:var(--text-2);}
  .msg-actions{display:flex; gap:6px;}
  .icon-btn{
    background:transparent; border:none; color:var(--text-2); cursor:pointer; font-size:12px; padding:3px 6px; border-radius:5px;
    display:inline-flex; align-items:center; gap:4px;
  }
  .icon-btn:hover{color:var(--text-0); background:var(--card);}
  .provider-tag{
    font-size:10.5px; padding:2px 7px; border-radius:10px; background:rgba(16,185,129,.12); color:var(--success); border:1px solid rgba(16,185,129,.25);
    display:inline-flex; align-items:center; gap:4px;
  }
  .provider-tag.victor{background:rgba(139,92,246,.15); color:#C4B5FD; border-color:rgba(139,92,246,.3);}
  .typing-indicator{display:flex; gap:4px; padding:14px 16px;}
  .typing-indicator span{
    width:7px; height:7px; border-radius:50%; background:var(--text-2); animation:bounce 1.2s infinite ease-in-out;
  }
  .typing-indicator span:nth-child(2){animation-delay:.15s;}
  .typing-indicator span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:.4;} 30%{transform:translateY(-5px); opacity:1;}}

  /* ── Input ── */
  .input-area{padding:14px 24px 18px; border-top:1px solid var(--border); background:var(--bg-1);}
  .input-toolbar{display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
  .input-row{display:flex; gap:10px; align-items:flex-end;}
  textarea{
    flex:1; resize:none; background:var(--card); border:1px solid var(--border); color:var(--text-0); border-radius:var(--radius);
    padding:12px 14px; font-size:14.5px; line-height:1.4; max-height:160px; min-height:46px; font-family:inherit;
  }
  textarea:focus{border-color:var(--primary);}
  .send-btn{
    width:46px; height:46px; border-radius:var(--radius); background:var(--primary); border:none; color:#fff; font-size:17px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s;
  }
  .send-btn:hover{background:var(--primary-d);}
  .send-btn:disabled{opacity:.5; cursor:not-allowed;}
  .input-footer{display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:var(--text-2);}
  .char-count.over{color:var(--error);}

  /* ── Image page ── */
  .scroll-page{flex:1; overflow-y:auto; padding:24px;}
  .panel{background:var(--bg-1); border:1px solid var(--border); border-radius:14px; padding:20px; max-width:720px; margin:0 auto 20px;}
  .field-label{font-size:12px; color:var(--text-2); margin-bottom:6px; font-weight:600;}
  .field{margin-bottom:16px;}
  .size-grid{display:flex; gap:8px; flex-wrap:wrap;}
  .size-opt{
    padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text-1);
    cursor:pointer; font-size:13px;
  }
  .size-opt.active{border-color:var(--primary); background:rgba(59,130,246,.15); color:#93C5FD;}
  .progress-bar{height:4px; background:var(--card); border-radius:4px; overflow:hidden; margin-top:10px; display:none;}
  .progress-bar.show{display:block;}
  .progress-fill{height:100%; width:30%; background:var(--primary); animation:progress 1.4s infinite ease-in-out;}
  @keyframes progress{0%{margin-left:-30%;} 100%{margin-left:100%;}}
  .image-result{max-width:720px; margin:0 auto; text-align:center;}
  .image-result img{max-width:100%; border-radius:14px; border:1px solid var(--border); display:block; margin:0 auto;}
  .image-result-meta{display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px; flex-wrap:wrap;}

  /* ── Models / status grid ── */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; max-width:1000px; margin:0 auto;}
  .card{background:var(--bg-1); border:1px solid var(--border); border-radius:14px; padding:16px;}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .card-title{font-size:14.5px; font-weight:600; color:var(--text-0);}
  .card-desc{font-size:12.5px; color:var(--text-2); line-height:1.5;}
  .badge{font-size:11px; padding:3px 9px; border-radius:20px; white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
  .badge-ok{background:rgba(16,185,129,.15); color:var(--success); border:1px solid rgba(16,185,129,.3);}
  .badge-bad{background:rgba(239,68,68,.15); color:var(--error); border:1px solid rgba(239,68,68,.3);}
  .status-page-top{display:flex; align-items:center; justify-content:space-between; max-width:1000px; margin:0 auto 16px;}
  .status-time{font-size:12px; color:var(--text-2);}

  /* ── Toasts ── */
  .toast-container{position:fixed; top:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:10px; max-width:320px;}
  .toast{
    background:var(--card); border:1px solid var(--border); border-left:3px solid var(--primary); color:var(--text-0);
    padding:12px 14px; border-radius:10px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.4); animation:slideIn .25s ease;
  }
  .toast.success{border-left-color:var(--success);}
  .toast.error{border-left-color:var(--error);}
  .toast.warning{border-left-color:var(--warning);}
  @keyframes slideIn{from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;}}

  .spinner{
    width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%;
    animation:spin .7s linear infinite; display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}

  @media (max-width:880px){
    .sidebar{position:fixed; top:0; left:0; height:100vh; transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .topbar{display:flex;}
    .page-header{padding:14px 16px;}
    .conversation{padding:16px;}
    .input-area{padding:12px 16px 14px;}
    .bubble-wrap{max-width:88%;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="overlay" id="overlay"></div>

  <!-- ───────── SIDEBAR ───────── -->
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation">
    <div class="sidebar-header">
      <div class="logo-mark"><svg class="icon icon-solid" width="18" height="18"><use href="#i-sparkle"/></svg></div>
      <div class="logo-text">Nova AI</div>
      <div class="status-badge" id="globalStatusBadge"><span class="status-dot" id="globalStatusDot"></span><span id="globalStatusText">Checking</span></div>
    </div>

    <div class="user-section" id="userSection">
      <!-- populated by JS -->
    </div>

    <div class="model-section">

      <select id="modelSelect" aria-label="Select AI model" disabled>

    <div class="sidebar-footer">Nova AI · v2.0</div>
  </aside>

  <!-- ───────── MAIN ───────── -->
  <main class="main">
    <div class="topbar">

        <div class="page-title">Nova AI Chat</div>
        <div class="header-meta">
          <span class="pill" id="chatModelPill">Model: Auto</span>
          <span class="pill pill-primary" id="chatProviderPill" style="display:none;"></span>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-sm btn-ghost" id="newChatBtn" title="New chat"><svg class="icon" width="14" height="14"><use href="#i-plus"/></svg> New</button>
          <button class="btn btn-sm btn-ghost" id="clearChatBtn" title="Clear chat"><svg class="icon" width="14" height="14"><use href="#i-trash"/></svg> Clear</button>
          <button class="btn btn-sm btn-ghost" id="exportChatBtn" title="Export chat"><svg class="icon" width="14" height="14"><use href="#i-download"/></svg> Export</button>
        </div>

      <div class="conversation" id="conversation" role="log" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="logo-mark"><svg class="icon icon-solid" width="26" height="26"><use href="#i-sparkle"/></svg></div>
          <div style="font-size:15px; color:var(--text-0); font-weight:600;">Start a conversation</div>
          <div style="font-size:13px;">Ask Nova AI anything — coding help, writing, analysis, and more.</div>

        <div class="input-row">
          <label for="chatInput" class="visually-hidden">Message Nova AI</label>
          <textarea id="chatInput" rows="1" placeholder="Message Nova AI… (Enter to send, Shift+Enter for new line)" maxlength="12000"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send message"><svg class="icon" width="17" height="17"><use href="#i-send"/></svg></button>
        </div>
        <div class="input-footer">
          <span id="streamHint" style="visibility:hidden;">Nova is thinking…</span>
          <span class="char-count" id="charCount">0 / 12000</span>

    <!-- IMAGE PAGE -->

      <div class="scroll-page">
        <div class="panel">
          <div class="field">
            <div class="field-label">Prompt</div>
            <textarea id="imagePrompt" rows="3" placeholder="Describe the image you want to generate…" style="width:100%;"></textarea>
          </div>
          <div class="field">
            <div class="field-label">Size</div>
            <div class="size-grid" id="sizeGrid">
              <button class="size-opt" data-size="256">256×256</button>
              <button class="size-opt active" data-size="512">512×512</button>
              <button class="size-opt" data-size="768">768×768</button>
              <button class="size-opt" data-size="1024">1024×1024</button>
            </div>
          </div>
          <button class="btn btn-primary btn-block" id="generateImageBtn">Generate Image</button>
          <div class="progress-bar" id="imageProgress"><div class="progress-fill"></div></div>
        </div>

        <div class="image-result" id="imageResult"></div>
      </div>
    </section>

    <!-- MODELS PAGE -->
    <section class="page" id="page-models" aria-label="Models">
      <div class="page-header">
        <div class="page-title">Available Models</div>
      </div>
      <div class="scroll-page">
        <div class="grid" id="modelsGrid">
          <div class="card-desc">Loading models…</div>
        </div>
      </div>
    </section>

    <!-- STATUS PAGE -->
    <section class="page" id="page-status" aria-label="System Status">
      <div class="page-header">
        <div class="page-title">System Status</div>
        <button class="btn btn-sm btn-ghost" id="refreshHealthBtn"><svg class="icon" width="14" height="14"><use href="#i-refresh"/></svg> Refresh</button>
      </div>
      <div class="scroll-page">
        <div class="status-page-top">
          <span class="pill" id="overallHealthPill">Checking…</span>
          <span class="status-time" id="healthTimestamp"></span>
        </div>
        <div class="grid" id="statusGrid"></div>
      </div>
    </section>
  </main>
</div>

<div class="toast-container" id="toastContainer" aria-live="assertive"></div>

<script>
(function(){
  'use strict';

  /* ─────────────────────────── State ─────────────────────────── */
  const state = {
    history: [],              // [{role, content, provider, ts}]
    models: [],
    selectedModel: 'auto',
    user: null,                // {loggedIn, user}
    guestToken: localStorage.getItem('nova_guest_token') || null,
    isStreaming: false,
  };

  const MAX_STORED_MESSAGES = 100;

  /* ─────────────────────────── Utilities ─────────────────────────── */
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Manual minimal markdown -> safe HTML (escapes first, then applies formatting to escaped text)
  function formatMessage(raw){
    let text = escapeHtml(raw);

    // Code blocks ```code```
    text = text.replace(/```([\s\S]*?)```/g, function(_, code){
      return '<pre><code>' + code.replace(/^\n/, '') + '</code></pre>';
    });
    // Inline code `code`
    text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    // Headings
    text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
    text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
    text = text.replace(/^# (.*)$/gm, '<h1>$1</h1>');
    // Bold / italics
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
    // Unordered lists
    text = text.replace(/(^|\n)([-*] .+(\n[-*] .+)*)/g, function(_, lead, block){
      const items = block.split('\n').map(l => l.replace(/^[-*]\s+/, '')).map(li => '<li>' + li + '</li>').join('');
      return lead + '<ul>' + items + '</ul>';
    });
    // Ordered lists
    text = text.replace(/(^|\n)(\d+\. .+(\n\d+\. .+)*)/g, function(_, lead, block){
      const items = block.split('\n').map(l => l.replace(/^\d+\.\s+/, '')).map(li => '<li>' + li + '</li>').join('');
      return lead + '<ol>' + items + '</ol>';
    });
    // Line breaks (avoid double-breaking inside block elements we just made)
    text = text.replace(/\n/g, '<br>');
    // Clean up <br> directly around block tags
    text = text.replace(/<br>(<\/?(ul|ol|li|pre|h1|h2|h3)>)/g, '$1').replace(/(<(ul|ol|pre|h1|h2|h3)>)<br>/g, '$1');

    return text;
  }

  function formatTime(ts){
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  }

  function badgeHTML(ok, okLabel, badLabel){
    const icon = ok ? 'i-check-circle' : 'i-x-circle';
    const label = ok ? (okLabel || 'Available') : (badLabel || 'Unavailable');
    return '<span class="badge ' + (ok ? 'badge-ok' : 'badge-bad') + '">' +
      '<svg class="icon" width="11" height="11"><use href="#' + icon + '"/></svg>' + label + '</span>';
  }

  const TOAST_ICONS = { success:'i-check-circle', error:'i-x-circle', warning:'i-alert', info:'i-info' };
  function showToast(message, type){
    type = type || 'info';
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerHTML = '<svg class="icon" width="14" height="14" style="margin-right:6px;flex-shrink:0;"><use href="#' + (TOAST_ICONS[type] || 'i-info') + '"/></svg><span></span>';
    toast.style.display = 'flex';
    toast.style.alignItems = 'center';
    toast.querySelector('span').textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity .3s';
      setTimeout(() => toast.remove(), 300);
    }, 4200);
  }

  function setButtonLoading(btn, loading, loadingText){
    if(loading){
      btn.dataset.originalHtml = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span>' + (loadingText ? ' ' + escapeHtml(loadingText) : '');
      btn.disabled = true;
    } else {
      if(btn.dataset.originalHtml) btn.innerHTML = btn.dataset.originalHtml;
      btn.disabled = false;
    }
  }

  /* ─────────────────────────── Navigation ─────────────────────────── */
  const navButtons = document.querySelectorAll('.nav-btn');
  const pages = document.querySelectorAll('.page');
  navButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.page;
      navButtons.forEach(b => b.classList.toggle('active', b === btn));
      pages.forEach(p => p.classList.toggle('active', p.id === 'page-' + target));
      closeSidebarMobile();
      if(target === 'status') loadHealth();
      if(target === 'models') renderModelsPage();
    });
  });

  /* Mobile sidebar */
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  document.getElementById('hamburgerBtn').addEventListener('click', () => {
    sidebar.classList.add('open');
    overlay.classList.add('show');
  });
  overlay.addEventListener('click', closeSidebarMobile);
  function closeSidebarMobile(){
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  }

  /* ─────────────────────────── Auth ─────────────────────────── */
  async function loadMe(){
    const userSection = document.getElementById('userSection');
    try{
      const res = await fetch('/api/me', { credentials: 'include' });
      const data = await res.json();
      state.user = data;
      renderUserSection();
    }catch(err){
      console.error('Failed to load /api/me', err);
      renderUserSection(); // fall back to login buttons
    }
  }

  function renderUserSection(){
    const userSection = document.getElementById('userSection');
    const guestActive = !!state.guestToken && !(state.user && state.user.loggedIn);

    if(state.user && state.user.loggedIn && state.user.user){
      const u = state.user.user;
      const initial = (u.name || 'U').charAt(0).toUpperCase();
      userSection.innerHTML =
        '<div class="user-card">' +
          '<div class="user-avatar">' + (u.picture ? '<img src="' + escapeHtml(u.picture) + '" alt="">' : escapeHtml(initial)) + '</div>' +
          '<div class="user-meta">' +
            '<div class="user-name">' + escapeHtml(u.name || 'User') + '</div>' +
            '<div class="user-email">' + escapeHtml(u.email || '') + '</div>' +
          '</div>' +
        '</div>' +
        '<button class="btn btn-block btn-sm btn-danger-outline" style="margin-top:10px;" id="logoutBtn"><svg class="icon" width="14" height="14"><use href="#i-log-out"/></svg> Logout</button>';
      document.getElementById('logoutBtn').addEventListener('click', () => { window.location.href = '/logout'; });
    } else if(guestActive){
      userSection.innerHTML =
        '<div class="user-card">' +
          '<div class="user-avatar">G</div>' +
          '<div class="user-meta">' +
            '<div class="user-name">Guest</div>' +
            '<div class="user-email">Not signed in</div>' +
          '</div>' +
        '</div>' +
        '<button class="btn btn-block btn-sm btn-danger-outline" style="margin-top:10px;" id="logoutGuestBtn"><svg class="icon" width="14" height="14"><use href="#i-log-out"/></svg> End Guest Session</button>';
      document.getElementById('logoutGuestBtn').addEventListener('click', () => {
        localStorage.removeItem('nova_guest_token');
        state.guestToken = null;
        renderUserSection();
        showToast('Guest session ended', 'info');
      });
    } else {
      userSection.innerHTML =
        '<div class="auth-buttons">' +
          '<button class="btn btn-block" id="googleLoginBtn"><svg class="icon" width="16" height="16"><use href="#i-google"/></svg> Continue with Google</button>' +
          '<button class="btn btn-block btn-ghost" id="guestLoginBtn"><svg class="icon" width="15" height="15"><use href="#i-user"/></svg> Continue as Guest</button>' +
        '</div>';
      document.getElementById('googleLoginBtn').addEventListener('click', () => { window.location.href = '/auth/google'; });
      document.getElementById('guestLoginBtn').addEventListener('click', guestLogin);
    }
  }

  async function guestLogin(){
    const btn = document.getElementById('guestLoginBtn');
    if(btn) setButtonLoading(btn, true);
    try{
      const res = await fetch('/api/guest', { method: 'POST', credentials: 'include' });
      const data = await res.json();
      if(data && data.success){
        state.guestToken = data.token;
        localStorage.setItem('nova_guest_token', data.token);
        renderUserSection();
        showToast('Signed in as Guest', 'success');
      } else {
        showToast('Guest login failed', 'error');
      }
    }catch(err){
      console.error(err);
      showToast('Guest login failed — server unreachable', 'error');
    }finally{
      if(btn) setButtonLoading(btn, false);
    }
  }

  // Reflect ?auth=success/failed from Google OAuth redirect
  (function checkAuthRedirect(){
    const params = new URLSearchParams(window.location.search);
    const auth = params.get('auth');
    if(auth === 'success') showToast('Signed in with Google', 'success');
    if(auth === 'failed') showToast('Google sign-in failed', 'error');
    if(auth){
      params.delete('auth');
      const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.replaceState({}, '', newUrl);
    }
  })();

  /* ─────────────────────────── Models ─────────────────────────── */
  async function loadModels(){
    const select = document.getElementById('modelSelect');
    try{
      const res = await fetch('/api/models');
      const data = await res.json();
      state.models = (data && data.models) || [];
      select.innerHTML = '';
      state.models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.name + (m.available ? '' : ' (unavailable)');
        opt.disabled = !m.available;
        select.appendChild(opt);
      });
      select.disabled = false;
      const saved = localStorage.getItem('nova_selected_model');
      if(saved && state.models.some(m => m.id === saved && m.available)){
        select.value = saved;
      }
      state.selectedModel = select.value || 'auto';
      updateModelDesc();
      updateChatModelPill();
    }catch(err){
      console.error('Failed to load models', err);
      select.innerHTML = '<option value="auto">Auto</option>';
      state.selectedModel = 'auto';
      showToast('Could not load model list — defaulting to Auto', 'warning');
    }
  }

  function updateModelDesc(){
    const desc = document.getElementById('modelDesc');
    const m = state.models.find(x => x.id === state.selectedModel);
    desc.textContent = m ? m.description : '';
  }

  function updateChatModelPill(){
    const m = state.models.find(x => x.id === state.selectedModel);
    document.getElementById('chatModelPill').textContent = 'Model: ' + (m ? m.name : state.selectedModel);
  }

  document.getElementById('modelSelect').addEventListener('change', (e) => {
    state.selectedModel = e.target.value;
    localStorage.setItem('nova_selected_model', state.selectedModel);
    updateModelDesc();
    updateChatModelPill();
  });

  function renderModelsPage(){
    const grid = document.getElementById('modelsGrid');
    if(!state.models.length){
      grid.innerHTML = '<div class="card-desc">No models loaded.</div>';
      return;
    }
    grid.innerHTML = state.models.map(m =>
      '<div class="card">' +
        '<div class="card-top">' +
          '<div class="card-title">' + escapeHtml(m.name) + '</div>' +
          badgeHTML(m.available) +
        '</div>' +
        '<div class="card-desc">' + escapeHtml(m.description) + '</div>' +
      '</div>'
    ).join('');
  }

  /* ─────────────────────────── Health ─────────────────────────── */
  const providerLabels = {
    groq: 'Groq', gemini: 'Gemini', pollinations: 'Pollinations', victor: 'Victor', googleAuth: 'Google Auth'
  };

  async function loadHealth(){
    const grid = document.getElementById('statusGrid');
    const overallPill = document.getElementById('overallHealthPill');
    const timestampEl = document.getElementById('healthTimestamp');
    const globalDot = document.getElementById('globalStatusDot');
    const globalText = document.getElementById('globalStatusText');
    const globalBadge = document.getElementById('globalStatusBadge');
    try{
      const res = await fetch('/api/health');
      const data = await res.json();
      const healthy = data.status === 'healthy';

      overallPill.innerHTML = (healthy
        ? '<svg class="icon" width="13" height="13"><use href="#i-check-circle"/></svg> Server Healthy'
        : '<svg class="icon" width="13" height="13"><use href="#i-x-circle"/></svg> Server Issues');
      overallPill.className = 'pill ' + (healthy ? 'pill-primary' : '');
      timestampEl.textContent = data.timestamp ? 'Last checked: ' + new Date(data.timestamp).toLocaleTimeString() : '';

      globalDot.classList.toggle('down', !healthy);
      globalBadge.classList.toggle('down', !healthy);
      globalText.textContent = healthy ? 'Online' : 'Issues';

      const providers = data.providers || {};
      grid.innerHTML = Object.keys(providers).map(key => {
        const ok = !!providers[key];
        const label = providerLabels[key] || key;
        return '<div class="card">' +
          '<div class="card-top">' +
            '<div class="card-title">' + escapeHtml(label) + '</div>' +
            badgeHTML(ok) +
          '</div>' +
          '<div class="card-desc">' + (ok ? 'Operating normally.' : 'Currently unavailable or not configured.') + '</div>' +
        '</div>';
      }).join('');
    }catch(err){
      console.error('Health check failed', err);
      overallPill.innerHTML = '<svg class="icon" width="13" height="13"><use href="#i-x-circle"/></svg> Unreachable';
      grid.innerHTML = '<div class="card-desc">Could not reach health endpoint.</div>';
      globalDot.classList.add('down');
      globalBadge.classList.add('down');
      globalText.textContent = 'Offline';
    }
  }
  document.getElementById('refreshHealthBtn').addEventListener('click', loadHealth);
  setInterval(loadHealth, 60000);

  /* ─────────────────────────── Chat persistence ─────────────────────────── */
  function loadStoredHistory(){
    try{
      const raw = localStorage.getItem('nova_chat_history');
      if(raw){
        state.history = JSON.parse(raw).slice(-MAX_STORED_MESSAGES);
      }
    }catch(err){ state.history = []; }
  }

  function persistHistory(){
    try{
      localStorage.setItem('nova_chat_history', JSON.stringify(state.history.slice(-MAX_STORED_MESSAGES)));
    }catch(err){ /* storage full or unavailable */ }
  }

  function renderHistory(){
    const conversation = document.getElementById('conversation');
    const emptyState = document.getElementById('emptyState');
    conversation.querySelectorAll('.msg-row').forEach(el => el.remove());
    if(state.history.length === 0){
      emptyState.style.display = 'flex';
      return;
    }
    emptyState.style.display = 'none';
    state.history.forEach(msg => appendMessageDOM(msg, false));
    scrollToBottom();
  }

  function scrollToBottom(){
    const conversation = document.getElementById('conversation');
    conversation.scrollTop = conversation.scrollHeight;
  }

  function appendMessageDOM(msg, animate){
    const conversation = document.getElementById('conversation');
    document.getElementById('emptyState').style.display = 'none';

    const row = document.createElement('div');
    row.className = 'msg-row ' + msg.role;

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatMessage(msg.content);

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    let metaHtml = '<span>' + formatTime(msg.ts || Date.now()) + '</span>';
    if(msg.role === 'assistant' && msg.provider){
      const isVictor = /victor/i.test(msg.provider);
      metaHtml += '<span class="provider-tag' + (isVictor ? ' victor' : '') + '">' + (isVictor ? '<svg class="icon icon-solid" width="9" height="9"><use href="#i-sparkle"/></svg> ' : '') + escapeHtml(msg.provider) + '</span>';
    }
    metaHtml += '<span class="msg-actions"><button class="icon-btn copy-btn" title="Copy message"><svg class="icon" width="12" height="12"><use href="#i-copy"/></svg> Copy</button></span>';
    meta.innerHTML = metaHtml;

    wrap.appendChild(bubble);
    wrap.appendChild(meta);
    row.appendChild(wrap);
    conversation.appendChild(row);

    meta.querySelector('.copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(msg.content).then(() => showToast('Copied to clipboard', 'success'))
        .catch(() => showToast('Could not copy', 'error'));
    });

    return bubble;
  }

  /* ─────────────────────────── Chat sending / streaming ─────────────────────────── */
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const charCount = document.getElementById('charCount');
  const streamHint = document.getElementById('streamHint');

  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + 'px';
    const len = chatInput.value.length;
    charCount.textContent = len + ' / 12000';
    charCount.classList.toggle('over', len > 12000);
  });

  chatInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage(){
    const text = chatInput.value.trim();
    if(!text || state.isStreaming) return;
    if(text.length > 12000){
      showToast('Message exceeds 12000 character limit', 'error');
      return;
    }

    const userMsg = { role: 'user', content: text, ts: Date.now() };
    state.history.push(userMsg);
    appendMessageDOM(userMsg, true);
    persistHistory();

    chatInput.value = '';
    chatInput.style.height = 'auto';
    charCount.textContent = '0 / 12000';
    charCount.classList.remove('over');
    scrollToBottom();

    // Typing indicator
    const conversation = document.getElementById('conversation');
    const typingRow = document.createElement('div');
    typingRow.className = 'msg-row assistant';
    typingRow.id = 'typingRow';
    typingRow.innerHTML = '<div class="bubble-wrap"><div class="bubble" style="padding:0;"><div class="typing-indicator"><span></span><span></span><span></span></div></div></div>';
    conversation.appendChild(typingRow);
    scrollToBottom();

    state.isStreaming = true;
    sendBtn.disabled = true;
    chatInput.disabled = true;
    streamHint.style.visibility = 'visible';

    // history sent to backend: prior messages excluding the one we just pushed, last 10 enforced server-side anyway
    const historyForRequest = state.history.slice(0, -1).map(m => ({ role: m.role, content: m.content }));

    let assistantText = '';
    let assistantBubble = null;
    let providerLabel = '';

    try{
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ message: text, history: historyForRequest, model: state.selectedModel })
      });

      if(!res.ok || !res.body){
        throw new Error('Chat request failed (' + res.status + ')');
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        buffer += decoder.decode(value, { stream: true });

        const events = buffer.split('\n\n');
        buffer = events.pop(); // keep incomplete trailing chunk

        for(const evt of events){
          const line = evt.trim();
          if(!line.startsWith('data:')) continue;
          const jsonStr = line.slice(5).trim();
          if(!jsonStr) continue;
          let payload;
          try{ payload = JSON.parse(jsonStr); } catch(e){ continue; }

          if(payload.error){
            throw new Error(payload.error);
          }

          if(payload.chunk){
            if(!assistantBubble){
              const typing = document.getElementById('typingRow');
              if(typing) typing.remove();
              assistantBubble = appendMessageDOM({ role: 'assistant', content: '', ts: Date.now() }, true);
            }
            assistantText += payload.chunk;
            assistantBubble.innerHTML = formatMessage(assistantText);
            scrollToBottom();
          }

          if(payload.done){
            providerLabel = payload.provider || '';
          }
        }
      }

      const typing = document.getElementById('typingRow');
      if(typing) typing.remove();

      const finalMsg = { role: 'assistant', content: assistantText || '(empty response)', provider: providerLabel, ts: Date.now() };
      state.history.push(finalMsg);
      persistHistory();

      // re-render last assistant bubble's meta info (provider tag + copy button)
      renderHistory();
      scrollToBottom();

      if(providerLabel){
        const pill = document.getElementById('chatProviderPill');
        pill.textContent = providerLabel;
        pill.style.display = 'inline-block';
      }

    }catch(err){
      console.error('Chat error:', err);
      const typing = document.getElementById('typingRow');
      if(typing) typing.remove();
      showToast(err.message || 'Nova AI is temporarily busy. Please try again.', 'error');
    }finally{
      state.isStreaming = false;
      sendBtn.disabled = false;
      chatInput.disabled = false;
      streamHint.style.visibility = 'hidden';
      chatInput.focus();
    }
  }

  document.getElementById('newChatBtn').addEventListener('click', () => {
    if(state.isStreaming) return;
    state.history = [];
    persistHistory();
    renderHistory();
    document.getElementById('chatProviderPill').style.display = 'none';
    showToast('Started a new chat', 'info');
  });

  document.getElementById('clearChatBtn').addEventListener('click', () => {
    if(state.isStreaming) return;
    state.history = [];
    persistHistory();
    renderHistory();
    document.getElementById('chatProviderPill').style.display = 'none';
    showToast('Chat cleared', 'info');
  });

  document.getElementById('exportChatBtn').addEventListener('click', () => {
    if(state.history.length === 0){
      showToast('Nothing to export', 'warning');
      return;
    }
    const lines = state.history.map(m => '[' + formatTime(m.ts) + '] ' + (m.role === 'user' ? 'You' : 'Nova AI') + ': ' + m.content);
    const blob = new Blob([lines.join('\n\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nova-ai-chat-' + Date.now() + '.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Chat exported', 'success');
  });

  /* ─────────────────────────── Image generation ─────────────────────────── */
  let selectedSize = 512;
  document.querySelectorAll('.size-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.size-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedSize = parseInt(btn.dataset.size, 10);
    });
  });

  document.getElementById('generateImageBtn').addEventListener('click', generateImage);

  async function generateImage(){
    const promptEl = document.getElementById('imagePrompt');
    const prompt = promptEl.value.trim();
    const resultEl = document.getElementById('imageResult');
    const btn = document.getElementById('generateImageBtn');
    const progress = document.getElementById('imageProgress');

    if(!prompt){
      showToast('Please enter a prompt', 'warning');
      return;
    }

    setButtonLoading(btn, true, 'Generating…');
    progress.classList.add('show');
    resultEl.innerHTML = '';

    try{
      const res = await fetch('/api/image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ prompt: prompt, size: selectedSize })
      });
      const data = await res.json();

      if(!res.ok || data.error){
        throw new Error(data.error || 'Image generation failed');
      }

      resultEl.innerHTML =
        '<img src="' + data.imageUrl + '" alt="' + escapeHtml(prompt) + '">' +
        '<div class="image-result-meta">' +
          '<span class="pill">Source: ' + escapeHtml(data.source || 'unknown') + '</span>' +
          '<button class="btn btn-sm" id="downloadImgBtn"><svg class="icon" width="13" height="13"><use href="#i-download"/></svg> Download</button>' +
        '</div>' +
        (data.note ? '<div class="card-desc" style="margin-top:8px;">' + escapeHtml(data.note) + '</div>' : '');

      document.getElementById('downloadImgBtn').addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = data.imageUrl;
        a.download = 'nova-ai-image-' + Date.now() + '.jpg';
        document.body.appendChild(a);
        a.click();
        a.remove();
      });

      showToast('Image generated', 'success');
    }catch(err){
      console.error('Image generation error:', err);
      resultEl.innerHTML =
        '<div class="card-desc" style="display:flex;align-items:center;gap:6px;"><svg class="icon" width="14" height="14" style="color:var(--error)"><use href="#i-alert"/></svg> ' + escapeHtml(err.message) + '</div>' +
        '<button class="btn btn-sm" id="retryImgBtn" style="margin-top:10px;"><svg class="icon" width="13" height="13"><use href="#i-refresh"/></svg> Retry</button>';
      document.getElementById('retryImgBtn').addEventListener('click', generateImage);
      showToast(err.message || 'Image generation failed', 'error');
    }finally{
      setButtonLoading(btn, false);
      progress.classList.remove('show');
    }
  }

  /* ─────────────────────────── Init ─────────────────────────── */
  function init(){
    loadStoredHistory();
    renderHistory();
    loadMe();
    loadModels();
    loadHealth();
  }

  init();
})();
</script>
