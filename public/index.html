<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
    .chat-container{background:white;border-radius:24px;width:100%;max-width:800px;height:600px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
    .header{background:#667eea;color:white;padding:20px;text-align:center}
    .messages{flex:1;overflow-y:auto;padding:20px;background:#f7f7f7}
    .message{margin-bottom:15px;display:flex}
    .message.user{justify-content:flex-end}
    .message-content{max-width:70%;padding:10px 15px;border-radius:18px;background:white;box-shadow:0 1px 2px rgba(0,0,0,0.1)}
    .message.user .message-content{background:#667eea;color:white}
    .input-area{display:flex;padding:20px;background:white;border-top:1px solid #ddd}
    .input-area input{flex:1;padding:12px;border:1px solid #ddd;border-radius:25px;outline:none}
    .input-area button{padding:12px 25px;background:#667eea;color:white;border:none;border-radius:25px;margin-left:10px;cursor:pointer}
    .guest-btn{background:#48bb78;color:white;border:none;padding:10px 20px;border-radius:20px;margin-top:20px;cursor:pointer;font-size:16px}
    .guest-area{text-align:center;padding:20px}
  </style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <h1>✨ Nova AI</h1>
    <p>Your intelligent assistant</p>
  </div>
  <div class="messages" id="messages">
    <div class="message assistant">
      <div class="message-content">Hello! Click "Guest Login" to start.</div>
    </div>
  </div>
  <div class="input-area" style="display:none" id="inputArea">
    <input type="text" id="messageInput" placeholder="Type your message...">
    <button id="sendBtn">Send</button>
  </div>
  <div class="guest-area" id="guestArea">
    <button class="guest-btn" id="guestBtn">Continue as Guest</button>
  </div>
</div>
<script>
let token = null;
const messagesDiv = document.getElementById('messages');
const inputArea = document.getElementById('inputArea');
const guestArea = document.getElementById('guestArea');
const guestBtn = document.getElementById('guestBtn');

guestBtn.onclick = async () => {
  const res = await fetch('/api/guest', { method: 'POST' });
  const data = await res.json();
  if (data.success) {
    token = data.token;
    guestArea.style.display = 'none';
    inputArea.style.display = 'flex';
    addMessage('assistant', 'Welcome! You are now logged in as Guest. Ask me anything!');
  } else {
    alert('Login failed');
  }
};

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('messageInput').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

async function sendMessage() {
  const input = document.getElementById('messageInput');
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  addMessage('user', message);
  const assistantDiv = addMessage('assistant', '...');
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, token })
  });
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let full = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = decoder.decode(value);
    const lines = chunk.split('\n');
    for (const line of lines) {
      if (line.startsWith('data: ')) {
        try {
          const data = JSON.parse(line.slice(6));
          if (data.chunk) {
            full += data.chunk;
            assistantDiv.querySelector('.message-content').innerHTML = full.replace(/\n/g,'<br>');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
          }
        } catch(e) {}
      }
    }
  }
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = `<div class="message-content">${text}</div>`;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  return div;
}
</script>
</body>
</html>
