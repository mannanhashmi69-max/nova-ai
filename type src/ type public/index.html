<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Nova AI | Next Generation Intelligence</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui;background:radial-gradient(circle at 20% 50%,#1a1a2e,#0a0a0f);color:#e0e0e0;overflow:hidden}
    .app-container{display:flex;height:100vh;position:relative}
    .sidebar{width:280px;background:rgba(20,20,30,0.95);backdrop-filter:blur(10px);border-right:1px solid rgba(100,100,150,0.2);display:flex;flex-direction:column;transition:transform 0.3s ease;z-index:100}
    .sidebar-header{padding:20px;border-bottom:1px solid rgba(100,100,150,0.2);display:flex;justify-content:space-between;align-items:center}
    .logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;background:linear-gradient(135deg,#a855f7,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
    .logo-icon{font-size:28px;color:#a855f7}
    .close-sidebar{display:none;background:none;border:none;color:#888;font-size:20px;cursor:pointer}
    .new-chat-btn{margin:16px;padding:12px;background:linear-gradient(135deg,#a855f7,#3b82f6);border:none;border-radius:12px;color:white;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
    .conversations-list{flex:1;overflow-y:auto;padding:0 12px}
    .conversation-item{padding:12px;margin:4px 0;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:rgba(30,30,40,0.6)}
    .conversation-item:hover{background:rgba(168,85,247,0.2)}
    .delete-conv{background:none;border:none;color:#888;cursor:pointer}
    .sidebar-footer{padding:20px;border-top:1px solid rgba(100,100,150,0.2)}
    .user-info{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .avatar{width:36px;height:36px;background:linear-gradient(135deg,#a855f7,#3b82f6);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .logout-btn{width:100%;padding:8px;background:rgba(255,80,80,0.2);border:1px solid rgba(255,80,80,0.3);border-radius:8px;color:#ff6b6b;cursor:pointer}
    .main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .top-bar{padding:16px 24px;background:rgba(20,20,30,0.6);backdrop-filter:blur(10px);border-bottom:1px solid rgba(100,100,150,0.2);display:flex;justify-content:space-between;align-items:center}
    .menu-toggle{display:none;background:none;border:none;color:white;font-size:24px;cursor:pointer}
    .top-actions{display:flex;gap:12px}
    .action-btn{padding:8px 16px;background:rgba(168,85,247,0.2);border:1px solid rgba(168,85,247,0.4);border-radius:20px;color:#a855f7;cursor:pointer}
    .chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
    .welcome-message{text-align:center;padding:60px 20px}
    .welcome-icon{font-size:64px;margin-bottom:20px}
    .welcome-message h2{font-size:28px;margin-bottom:12px;background:linear-gradient(135deg,#a855f7,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
    .message{display:flex;gap:12px}
    .message.user{justify-content:flex-end}
    .message-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
    .message.user .message-avatar{background:#3b82f6}
    .message.assistant .message-avatar{background:#a855f7}
    .message-content{flex:1;background:rgba(30,30,40,0.6);border-radius:16px;padding:12px 16px;line-height:1.5}
    .message.user .message-content{background:rgba(59,130,246,0.2);border:1px solid rgba(59,130,246,0.3)}
    .input-area{padding:20px;background:rgba(20,20,30,0.6);backdrop-filter:blur(10px);border-top:1px solid rgba(100,100,150,0.2)}
    .input-container{display:flex;gap:12px;align-items:flex-end}
    .input-container textarea{flex:1;background:rgba(40,40,55,0.8);border:1px solid rgba(100,100,150,0.3);border-radius:24px;padding:12px 18px;color:white;font-family:inherit;font-size:14px;resize:none;max-height:150px}
    .send-btn{width:44px;height:44px;background:linear-gradient(135deg,#a855f7,#3b82f6);border:none;border-radius:50%;color:white;cursor:pointer}
    .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);z-index:1000;align-items:center;justify-content:center}
    .modal.active{display:flex}
    .modal-content{background:#1a1a2a;border-radius:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;border:1px solid rgba(168,85,247,0.3)}
    .modal-header{padding:20px;border-bottom:1px solid rgba(100,100,150,0.2);display:flex;justify-content:space-between}
    .close-modal{background:none;border:none;color:#888;font-size:24px;cursor:pointer}
    .modal-body{padding:20px}
    .modal-body input,.modal-body select{width:100%;padding:12px;margin-bottom:16px;background:rgba(40,40,55,0.8);border:1px solid rgba(100,100,150,0.3);border-radius:12px;color:white}
    .generate-btn,.upload-btn,.auth-submit{width:100%;padding:12px;background:linear-gradient(135deg,#a855f7,#3b82f6);border:none;border-radius:12px;color:white;font-weight:600;cursor:pointer}
    .image-result img,.image-result img{max-width:100%;border-radius:12px}
    .loading-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:2000;align-items:center;justify-content:center;flex-direction:column}
    .loading-overlay.active{display:flex}
    .spinner{width:50px;height:50px;border:3px solid rgba(168,85,247,0.3);border-top-color:#a855f7;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:768px){.sidebar{position:fixed;left:-280px;height:100%;top:0}.sidebar.open{left:0}.close-sidebar{display:block}.menu-toggle{display:block}}
  </style>
</head>
<body>
<div class="app-container">
  <div class="glass-bg"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="logo"><div class="logo-icon">✨</div><span>Nova AI</span></div><button class="close-sidebar" id="closeSidebar">✕</button></div>
    <button class="new-chat-btn" id="newChatBtn"><span>+</span> New Chat</button>
    <div class="conversations-list" id="conversationsList"></div>
    <div class="sidebar-footer"><div class="user-info"><div class="avatar" id="userAvatar">👤</div><span id="userName">Guest</span></div><button class="logout-btn" id="logoutBtn">Logout</button></div>
  </aside>
  <main class="main-content">
    <div class="top-bar"><button class="menu-toggle" id="menuToggle">☰</button><div class="top-actions"><button class="action-btn" id="imageGenBtn">🎨 Generate Image</button><button class="action-btn" id="uploadBtn">📎 Upload File</button></div></div>
    <div class="chat-area"><div class="chat-messages" id="chatMessages"><div class="welcome-message"><div class="welcome-icon">✨</div><h2>Welcome to Nova AI</h2><p>Your intelligent assistant for chat, image generation, and file processing</p></div></div>
    <div class="input-area"><div class="input-container"><textarea id="messageInput" placeholder="Type your message here..." rows="1" maxlength="4000"></textarea><button id="sendBtn" class="send-btn">Send</button></div><div class="input-footer"><span>Nova AI may make mistakes. Verify important information.</span></div></div></div>
  </main>
  <div class="modal" id="imageModal"><div class="modal-content"><div class="modal-header"><h3>Generate Image</h3><button class="close-modal">✕</button></div><div class="modal-body"><input type="text" id="imagePrompt" placeholder="Describe the image..."><select id="imageSize"><option value="256x256">256x256</option><option value="512x512" selected>512x512</option><option value="1024x1024">1024x1024</option></select><button id="generateImageBtn" class="generate-btn">Generate</button><div id="imageResult" class="image-result"></div></div></div></div>
  <div class="modal" id="uploadModal"><div class="modal-content"><div class="modal-header"><h3>Upload File</h3><button class="close-modal">✕</button></div><div class="modal-body"><input type="file" id="fileInput" accept="image/*,application/pdf,text/plain,text/csv,application/json,text/markdown"><button id="uploadFileBtn" class="upload-btn">Upload</button><div id="uploadResult" class="upload-result"></div><div class="uploaded-files" id="uploadedFiles"></div></div></div></div>
  <div class="modal" id="authModal"><div class="modal-content auth-modal"><div class="modal-header"><h3 id="authTitle">Welcome to Nova AI</h3><button class="close-modal">✕</button></div><div class="modal-body"><div class="auth-tabs"><button class="tab-btn active" data-tab="login">Login</button><button class="tab-btn" data-tab="signup">Sign Up</button></div><form id="loginForm" class="auth-form active"><input type="email" placeholder="Email" id="loginEmail" required><input type="password" placeholder="Password" id="loginPassword" required><button type="submit" class="auth-submit">Login</button></form><form id="signupForm" class="auth-form"><input type="text" placeholder="Username" id="signupUsername" required><input type="email" placeholder="Email" id="signupEmail" required><input type="password" placeholder="Password" id="signupPassword" required><button type="submit" class="auth-submit">Create Account</button></form><div class="auth-divider">or</div><button id="guestBtn" class="guest-btn">Continue as Guest</button><button id="googleBtn" class="google-btn">Continue with Google</button></div></div></div>
  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><p>Processing...</p></div>
</div>
<script>
window.novaApp={token:localStorage.getItem('token'),user:null,currentConversationId:null,isLoading:false};
function showLoading(){document.getElementById('loadingOverlay').classList.add('active');window.novaApp.isLoading=true;}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('active');window.novaApp.isLoading=false;}
function showError(m){let d=document.createElement('div');d.className='error-toast';d.textContent=m;d.style.cssText='position:fixed;bottom:20px;right:20px;background:#ff4444;color:white;padding:12px 20px;border-radius:8px;z-index:3000';document.body.appendChild(d);setTimeout(()=>d.remove(),3000);}
function apiRequest(endpoint,options={}){let headers={'Content-Type':'application/json',...options.headers};if(window.novaApp.token)headers['Authorization']=`Bearer ${window.novaApp.token}`;return fetch(endpoint,{...options,headers}).then(async res=>{if(!res.ok){let err=await res.json().catch(()=>({error:'Request failed'}));throw new Error(err.error||'Request failed');}return res.json();});}
document.addEventListener('DOMContentLoaded',()=>{let urlParams=new URLSearchParams(window.location.search);let token=urlParams.get('token');if(token){localStorage.setItem('token',token);window.novaApp.token=token;window.history.replaceState({},document.title,'/');loadUser();}else if(window.novaApp.token){loadUser();}else{showAuthModal();}
document.getElementById('menuToggle').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');});
document.getElementById('closeSidebar').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');});
document.getElementById('newChatBtn').addEventListener('click',()=>{window.novaApp.currentConversationId=null;document.getElementById('chatMessages').innerHTML=`<div class="welcome-message"><div class="welcome-icon">✨</div><h2>Welcome to Nova AI</h2><p>Your intelligent assistant for chat, image generation, and file processing</p></div>`;loadConversations();if(window.innerWidth<=768)document.getElementById('sidebar').classList.remove('open');});
document.getElementById('logoutBtn').addEventListener('click',()=>{localStorage.removeItem('token');window.novaApp.token=null;window.novaApp.user=null;showAuthModal();});});
async function loadUser(){try{let user=await apiRequest('/api/auth/me');window.novaApp.user=user;document.getElementById('userName').textContent=user.username||user.email||'User';document.getElementById('userAvatar').textContent=(user.username?.[0]||'U').toUpperCase();loadConversations();}catch(e){console.error(e);localStorage.removeItem('token');window.novaApp.token=null;showAuthModal();}}
async function loadConversations(){try{let convs=await apiRequest('/api/conversations');let c=document.getElementById('conversationsList');if(convs.length===0){c.innerHTML='<div style="padding:20px;text-align:center;color:#666;">No conversations yet</div>';return;}c.innerHTML=convs.map(conv=>`<div class="conversation-item ${window.novaApp.currentConversationId===conv._id?'active':''}" data-id="${conv._id}"><span class="conversation-title">${escapeHtml(conv.title)}</span><button class="delete-conv" data-id="${conv._id}">🗑️</button></div>`).join('');
document.querySelectorAll('.conversation-item').forEach(el=>{el.addEventListener('click',(e)=>{if(!e.target.classList.contains('delete-conv'))loadConversation(el.dataset.id);});let del=el.querySelector('.delete-conv');if(del)del.addEventListener('click',(e)=>{e.stopPropagation();deleteConversation(del.dataset.id);});});}catch(e){console.error(e);}}
async function loadConversation(id){window.novaApp.currentConversationId=id;try{let msgs=await apiRequest(`/api/chat/${id}`);let container=document.getElementById('chatMessages');if(msgs.length===0)container.innerHTML='<div class="welcome-message"><div class="welcome-icon">💬</div><p>Start a conversation</p></div>';else container.innerHTML=msgs.map(msg=>`<div class="message ${msg.role}"><div class="message-avatar">${msg.role==='user'?'👤':'✨'}</div><div class="message-content">${formatMessage(msg.content)}</div></div>`).join('');loadConversations();if(window.innerWidth<=768)document.getElementById('sidebar').classList.remove('open');}catch(e){showError('Failed to load conversation');}}
async function deleteConversation(id){if(confirm('Delete this conversation?')){try{await apiRequest(`/api/conversations/${id}`,{method:'DELETE'});if(window.novaApp.currentConversationId===id){window.novaApp.currentConversationId=null;document.getElementById('chatMessages').innerHTML=`<div class="welcome-message"><div class="welcome-icon">✨</div><h2>Welcome to Nova AI</h2><p>Your intelligent assistant</p></div>`;}loadConversations();}catch(e){showError('Failed to delete conversation');}}}
function escapeHtml(t){let d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function formatMessage(c){return c.replace(/\n/g,'<br>').replace(/```(\w+)?\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');}
function showAuthModal(){document.getElementById('authModal').classList.add('active');}
document.addEventListener('DOMContentLoaded',()=>{const authModal=document.getElementById('authModal');const closeModal=authModal.querySelectorAll('.close-modal');const tabBtns=document.querySelectorAll('.tab-btn');const loginForm=document.getElementById('loginForm');const signupForm=document.getElementById('signupForm');const guestBtn=document.getElementById('guestBtn');const googleBtn=document.getElementById('googleBtn');closeModal.forEach(btn=>{btn.addEventListener('click',()=>{authModal.classList.remove('active');});});tabBtns.forEach(btn=>{btn.addEventListener('click',()=>{tabBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');let tab=btn.dataset.tab;document.querySelectorAll('.auth-form').forEach(f=>f.classList.remove('active'));document.getElementById(`${tab}Form`).classList.add('active');});});loginForm.addEventListener('submit',async(e)=>{e.preventDefault();let email=document.getElementById('loginEmail').value;let pwd=document.getElementById('loginPassword').value;showLoading();try{let res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});let data=await res.json();if(!res.ok)throw new Error(data.error);localStorage.setItem('token',data.token);window.novaApp.token=data.token;window.novaApp.user=data.user;authModal.classList.remove('active');loadUser();hideLoading();}catch(err){hideLoading();showError(err.message);}});signupForm.addEventListener('submit',async(e)=>{e.preventDefault();let username=document.getElementById('signupUsername').value;let email=document.getElementById('signupEmail').value;let pwd=document.getElementById('signupPassword').value;showLoading();try{let res=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,email,password:pwd})});let data=await res.json();if(!res.ok)throw new Error(data.error);localStorage.setItem('token',data.token);window.novaApp.token=data.token;window.novaApp.user=data.user;authModal.classList.remove('active');loadUser();hideLoading();}catch(err){hideLoading();showError(err.message);}});guestBtn.addEventListener('click',async()=>{showLoading();try{let res=await fetch('/api/auth/guest',{method:'POST'});let data=await res.json();if(!res.ok)throw new Error(data.error);localStorage.setItem('token',data.token);window.novaApp.token=data.token;window.novaApp.user=data.user;authModal.classList.remove('active');loadUser();hideLoading();}catch(err){hideLoading();showError(err.message);}});googleBtn.addEventListener('click',()=>{window.location.href='/api/auth/google';});});
document.addEventListener('DOMContentLoaded',()=>{const msgInp=document.getElementById('messageInput');const sendBtn=document.getElementById('sendBtn');const chatMsgs=document.getElementById('chatMessages');function autoResize(){msgInp.style.height='auto';msgInp.style.height=Math.min(msgInp.scrollHeight,150)+'px';}msgInp.addEventListener('input',autoResize);msgInp.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});sendBtn.addEventListener('click',sendMessage);async function sendMessage(){let msg=msgInp.value.trim();if(!msg||window.novaApp.isLoading)return;msgInp.value='';autoResize();let userDiv=document.createElement('div');userDiv.className='message user';userDiv.innerHTML=`<div class="message-avatar">👤</div><div class="message-content">${escapeHtml(msg)}</div>`;chatMsgs.appendChild(userDiv);let welcomeMsg=chatMsgs.querySelector('.welcome-message');if(welcomeMsg)welcomeMsg.remove();let assistantDiv=document.createElement('div');assistantDiv.className='message assistant';assistantDiv.innerHTML=`<div class="message-avatar">✨</div><div class="message-content"><em>Thinking...</em></div>`;chatMsgs.appendChild(assistantDiv);chatMsgs.scrollTop=chatMsgs.scrollHeight;window.novaApp.isLoading=true;try{let resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${window.novaApp.token}`},body:JSON.stringify({message:msg,conversationId:window.novaApp.currentConversationId,stream:true})});if(!resp.ok)throw new Error('Chat request failed');let reader=resp.body.getReader();let decoder=new TextDecoder();let full='';let contentDiv=assistantDiv.querySelector('.message-content');contentDiv.innerHTML='';while(true){let{done,value}=await reader.read();if(done)break;let chunk=decoder.decode(value);let lines=chunk.split('\n');for(let line of lines){if(line.startsWith('data: ')){let data=line.slice(6);if(data==='[DONE]')continue;try{let parsed=JSON.parse(data);if(parsed.chunk){full+=parsed.chunk;contentDiv.innerHTML=formatMessage(full);chatMsgs.scrollTop=chatMsgs.scrollHeight;}if(parsed.conversationId){window.novaApp.currentConversationId=parsed.conversationId;loadConversations();}if(parsed.done)break;}catch(e){}}}}if(!full)contentDiv.innerHTML='<em>No response generated</em>';}catch(err){console.error(err);assistantDiv.querySelector('.message-content').innerHTML='<em>Error: Failed to get response</em>';showError('Chat failed: '+err.message);}finally{window.novaApp.isLoading=false;chatMsgs.scrollTop=chatMsgs.scrollHeight;}}});
document.addEventListener('DOMContentLoaded',()=>{const imgGenBtn=document.getElementById('imageGenBtn');const imgModal=document.getElementById('imageModal');const genBtn=document.getElementById('generateImageBtn');const closeBtns=imgModal.querySelectorAll('.close-modal');const imgPrompt=document.getElementById('imagePrompt');const imgSize=document.getElementById('imageSize');const imgResult=document.getElementById('imageResult');imgGenBtn.addEventListener('click',()=>{imgModal.classList.add('active');imgPrompt.value='';imgResult.innerHTML='';});closeBtns.forEach(btn=>{btn.addEventListener('click',()=>imgModal.classList.remove('active'));});genBtn.addEventListener('click',async()=>{let prompt=imgPrompt.value.trim();if(!prompt){showError('Please enter a prompt');return;}imgResult.innerHTML='<div class="spinner" style="margin:20px auto;"></div>';try{let res=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${window.novaApp.token}`},body:JSON.stringify({prompt,size:imgSize.value})});let data=await res.json();if(!res.ok)throw new Error(data.error);imgResult.innerHTML=`<img src="${data.imageUrl}" alt="Generated image" style="width:100%;border-radius:12px;margin-top:16px;"><p style="margin-top:12px;font-size:12px;color:#888;">Prompt: ${escapeHtml(prompt)}</p>`;let chatMsgs=document.getElementById('chatMessages');let welcomeMsg=chatMsgs.querySelector('.welcome-message');if(welcomeMsg)welcomeMsg.remove();let imageMsg=document.createElement('div');imageMsg.className='message assistant';imageMsg.innerHTML=`<div class="message-avatar">🎨</div><div class="message-content"><p>Generated image for: <strong>${escapeHtml(prompt)}</strong></p><img src="${data.imageUrl}" style="max-width:100%;border-radius:12px;margin-top:8px;"></div>`;chatMsgs.appendChild(imageMsg);chatMsgs.scrollTop=chatMsgs.scrollHeight;}catch(err){imgResult.innerHTML=`<p style="color:#ff4444;">Error: ${err.message}</p>`;showError(err.message);}});imgModal.addEventListener('click',(e)=>{if(e.target===imgModal)imgModal.classList.remove('active');});});
document.addEventListener('DOMContentLoaded',()=>{const upBtn=document.getElementById('uploadBtn');const upModal=document.getElementById('uploadModal');const upFileBtn=document.getElementById('uploadFileBtn');const fileInp=document.getElementById('fileInput');const upResult=document.getElementById('uploadResult');const upFilesDiv=document.getElementById('uploadedFiles');const closeBtns=upModal.querySelectorAll('.close-modal');upBtn.addEventListener('click',()=>{upModal.classList.add('active');loadUploadedFiles();});closeBtns.forEach(btn=>{btn.addEventListener('click',()=>upModal.classList.remove('active'));});upFileBtn.addEventListener('click',async()=>{let file=fileInp.files[0];if(!file){showError('Please select a file');return;}let fd=new FormData();fd.append('file',file);upResult.innerHTML='<div class="spinner" style="margin:20px auto;"></div>';try{let res=await fetch('/api/upload',{method:'POST',headers:{'Authorization':`Bearer ${window.novaApp.token}`},body:fd});let data=await res.json();if(!res.ok)throw new Error(data.error);upResult.innerHTML=`<div style="background:rgba(76,175,80,0.2);padding:12px;border-radius:8px;">✅ Uploaded: ${data.originalName}<br><small>${(data.size/1024).toFixed(2)} KB</small><br><a href="${data.url}" target="_blank" style="color:#a855f7;">View file</a></div>`;fileInp.value='';loadUploadedFiles();let chatMsgs=document.getElementById('chatMessages');let welcomeMsg=chatMsgs.querySelector('.welcome-message');if(welcomeMsg)welcomeMsg.remove();let fileMsg=document.createElement('div');fileMsg.className='message user';fileMsg.innerHTML=`<div class="message-avatar">📎</div><div class="message-content">Uploaded file: <strong>${escapeHtml(data.originalName)}</strong><br><a href="${data.url}" target="_blank" style="color:#a855f7;">Open file</a></div>`;chatMsgs.appendChild(fileMsg);chatMsgs.scrollTop=chatMsgs.scrollHeight;}catch(err){upResult.innerHTML=`<p style="color:#ff4444;">Error: ${err.message}</p>`;showError(err.message);}});async function loadUploadedFiles(){try{let res=await fetch('/api/upload',{headers:{'Authorization':`Bearer ${window.novaApp.token}`}});let files=await res.json();if(!res.ok)throw new Error(files.error);if(files.length===0){upFilesDiv.innerHTML='<p style="color:#666;">No files uploaded yet</p>';return;}upFilesDiv.innerHTML=`<h4 style="margin-bottom:12px;">Your Files</h4>${files.map(f=>`<div style="background:rgba(40,40,55,0.5);padding:10px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;"><div style="flex:1"><div style="font-size:13px;">${escapeHtml(f.originalName)}</div><small style="color:#888;">${(f.size/1024).toFixed(2)} KB</small></div><a href="${f.url}" target="_blank" style="color:#a855f7;margin-right:12px;">View</a><button class="delete-file" data-id="${f.id}" style="background:none;border:none;color:#ff6b6b;cursor:pointer;">🗑️</button></div>`).join('')}`;document.querySelectorAll('.delete-file').forEach(btn=>{btn.addEventListener('click',async(e)=>{let id=btn.dataset.id;if(confirm('Delete this file?')){await fetch(`/api/upload/${id}`,{method:'DELETE',headers:{'Authorization':`Bearer ${window.novaApp.token}`}});loadUploadedFiles();}});});}catch(err){console.error(err);}}upModal.addEventListener('click',(e)=>{if(e.target===upModal)upModal.classList.remove('active');});});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').then(reg=>console.log('SW registered:',reg)).catch(err=>console.log('SW failed:',err));});}
let deferredPrompt;window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;let btn=document.createElement('button');btn.textContent='📱 Install App';btn.className='action-btn';btn.style.cssText='position:fixed;bottom:20px;right:20px;z-index:1000;background:linear-gradient(135deg,#a855f7,#3b82f6);border:none;padding:10px 20px;border-radius:25px;color:white;cursor:pointer';btn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();let{outcome}=await deferredPrompt.userChoice;console.log(outcome);deferredPrompt=null;btn.remove();}};setTimeout(()=>{if(!document.querySelector('.install-prompt-btn')){btn.classList.add('install-prompt-btn');document.body.appendChild(btn);}},2000);});
</script>
